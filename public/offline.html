<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Koneksi Terputus — CBT Sekolah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/liquid-glass.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .offline-card {
            max-width: 440px;
            width: 100%;
            text-align: center;
            padding: 36px 28px;
            border-radius: 24px;
        }
        .offline-icon {
            font-size: 3.5rem;
            margin-bottom: 16px;
            display: inline-block;
            animation: bounce 2s infinite ease-in-out;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>
    <div class="liquid-glow-container" aria-hidden="true">
        <div class="liquid-glow-orb liquid-glow-orb-1"></div>
        <div class="liquid-glow-orb liquid-glow-orb-2"></div>
    </div>

    <div class="card glass-card offline-card shadow-lg">
        <div class="offline-icon">📡</div>
        <h3 class="fw-bold mb-2">Koneksi Terputus</h3>
        <p class="text-secondary small mb-4">
            Perangkat Anda sedang tidak terhubung ke jaringan internet. Jawaban yang telah Anda pilih tersimpan dengan aman di browser. Hubungkan kembali internet Anda untuk melanjutkan.
        </p>
        <button class="btn btn-primary w-100 py-3 fw-bold mb-2" onclick="window.location.reload()">
            🔄 Muat Ulang Halaman
        </button>
        <div class="text-secondary small mt-3">
            ExamBro CBT PWA · Offline Resilience
        </div>
    </div>
</body>
</html>
